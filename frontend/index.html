<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Destination Guide</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1000px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { margin-bottom: .25rem; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: .75rem; background: #f5f7fa; padding: 1rem; border-radius: 8px; }
    label { display: flex; flex-direction: column; font-size: .85rem; gap: .25rem; }
    input, textarea { padding: .5rem; border: 1px solid #bbb; border-radius: 4px; font: inherit; }
    .wide { grid-column: 1 / -1; }
    button { padding: .5rem 1rem; border: 0; border-radius: 4px; cursor: pointer; background: #1a73e8; color: #fff; }
    button.secondary { background: #777; }
    button.danger { background: #d93025; }
    .table-wrap { overflow-x: auto; margin-top: 1.5rem; }
    table { border-collapse: collapse; width: 100%; font-size: .9rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    th { background: #eef1f5; }
    #msg { margin: .75rem 0; min-height: 1.2rem; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Travel Destination Guide</h1>
  <div id="msg"></div>

  <form id="form">
    <input type="hidden" id="id" />
    <label>Destination * <input id="destination" required /></label>
    <label>Country * <input id="country" required /></label>
    <label>Category <input id="category" placeholder="Beach, Safari, City..." /></label>
    <label>Best season <input id="best_season" placeholder="Jun-Oct" /></label>
    <label>Avg cost (USD) <input id="avg_cost_usd" type="number" min="0" /></label>
    <label>Rating (0-5) <input id="rating" type="number" step="0.1" min="0" max="5" /></label>
    <label class="wide">Description <textarea id="description" rows="2"></textarea></label>
    <div class="wide">
      <button type="submit" id="saveBtn">Add destination</button>
      <button type="button" class="secondary" id="cancelBtn" hidden>Cancel edit</button>
    </div>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>ID</th><th>Destination</th><th>Country</th><th>Category</th><th>Season</th><th>Cost</th><th>Rating</th><th>Description</th><th>Actions</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
